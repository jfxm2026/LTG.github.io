name: Publish approved updates

# The publisher pushes James-approved updates to the `staging` branch.
# This workflow takes them live by fast-forwarding `main` to `staging`.
on:
  push:
    branches: [staging]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main to staging
        run: |
          git fetch origin staging
          git merge --ff-only origin/staging
          git push origin main
